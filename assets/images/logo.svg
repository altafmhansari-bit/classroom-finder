<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A6DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F3D8C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d6e4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F3D8C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="200" height="200" rx="44" ry="44" fill="url(#bgGrad)"/>

  <!-- Subtle grid dots pattern -->
  <g opacity="0.08">
    <circle cx="30" cy="30" r="2" fill="white"/>
    <circle cx="60" cy="30" r="2" fill="white"/>
    <circle cx="90" cy="30" r="2" fill="white"/>
    <circle cx="30" cy="60" r="2" fill="white"/>
    <circle cx="170" cy="30" r="2" fill="white"/>
    <circle cx="170" cy="60" r="2" fill="white"/>
    <circle cx="140" cy="30" r="2" fill="white"/>
    <circle cx="30" cy="170" r="2" fill="white"/>
    <circle cx="170" cy="170" r="2" fill="white"/>
    <circle cx="170" cy="140" r="2" fill="white"/>
    <circle cx="30" cy="140" r="2" fill="white"/>
  </g>

  <!-- ── BUILDING BODY ── -->
  <!-- Main building block -->
  <rect x="42" y="85" width="116" height="75" rx="4" fill="url(#buildingGrad)" filter="url(#shadow)"/>

  <!-- Left wing (slightly shorter) -->
  <rect x="28" y="100" width="24" height="60" rx="3" fill="white" opacity="0.85"/>

  <!-- Right wing -->
  <rect x="148" y="100" width="24" height="60" rx="3" fill="white" opacity="0.85"/>

  <!-- ── ROOF / PEDIMENT ── -->
  <!-- Triangular pediment -->
  <polygon points="100,52 148,85 52,85" fill="white" filter="url(#shadow)"/>
  <!-- Pediment accent line -->
  <polygon points="100,60 140,85 60,85" fill="#1A6DFF" opacity="0.15"/>

  <!-- ── COLUMNS ── -->
  <rect x="62" y="85" width="8" height="75" rx="2" fill="#1A6DFF" opacity="0.18"/>
  <rect x="82" y="85" width="8" height="75" rx="2" fill="#1A6DFF" opacity="0.18"/>
  <rect x="110" y="85" width="8" height="75" rx="2" fill="#1A6DFF" opacity="0.18"/>
  <rect x="130" y="85" width="8" height="75" rx="2" fill="#1A6DFF" opacity="0.18"/>

  <!-- ── WINDOWS (top row) ── -->
  <!-- Window 1 -->
  <rect x="55" y="96" width="18" height="20" rx="3" fill="#1A6DFF" opacity="0.5"/>
  <rect x="56" y="97" width="7" height="18" rx="1.5" fill="white" opacity="0.6"/>
  <!-- Window 2 -->
  <rect x="91" y="96" width="18" height="20" rx="3" fill="#1A6DFF" opacity="0.5"/>
  <rect x="92" y="97" width="7" height="18" rx="1.5" fill="white" opacity="0.6"/>
  <!-- Window 3 -->
  <rect x="127" y="96" width="18" height="20" rx="3" fill="#1A6DFF" opacity="0.5"/>
  <rect x="128" y="97" width="7" height="18" rx="1.5" fill="white" opacity="0.6"/>

  <!-- ── DOOR ── -->
  <rect x="87" y="133" width="26" height="27" rx="4" fill="#0F3D8C" opacity="0.7"/>
  <!-- Door arch -->
  <path d="M87,142 Q100,128 113,142" fill="#0F3D8C" opacity="0.7"/>
  <!-- Door handle -->
  <circle cx="109" cy="147" r="2.5" fill="white" opacity="0.9"/>

  <!-- ── LOCATION PIN (top right accent) ── -->
  <g transform="translate(138, 38)">
    <!-- Pin body -->
    <path d="M12,0 C5.4,0 0,5.4 0,12 C0,20 12,30 12,30 C12,30 24,20 24,12 C24,5.4 18.6,0 12,0 Z"
          fill="white" filter="url(#shadow)"/>
    <!-- Pin inner circle -->
    <circle cx="12" cy="12" r="5" fill="#1A6DFF"/>
    <!-- Pin highlight -->
    <circle cx="9" cy="9" r="2" fill="white" opacity="0.6"/>
  </g>

  <!-- ── BASE LINE ── -->
  <rect x="22" y="160" width="156" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="38" y="160" width="124" height="4" rx="2" fill="white" opacity="0.4"/>
</svg>
